name: Lab 2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate package metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Build Docker image
        run: docker build --tag devops-lab2-app:ci .

      - name: Start container
        run: docker run --detach --publish 3000:3000 --name lab2-app devops-lab2-app:ci

      - name: Smoke test HTTP endpoint
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:3000 | grep -q 'Hello from Docker'; then
              exit 0
            fi
            sleep 2
          done
          docker logs lab2-app
          exit 1

      - name: Stop container
        if: always()
        run: docker rm --force lab2-app || true
